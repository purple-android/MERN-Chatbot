# render.yaml
# This file tells Render which system packages to install before building.
# The 'canvas' npm package needs these Linux libraries to work.
# Without them, PDF image extraction (OCR) crashes on the server.

services:
  - type: web
    name: MERN-Chatbot-1     # ← replace this with your exact service name from Render's dashboard
    env: node
    packages:
      - build-essential              # C++ build tools — needed to compile native modules
      - libcairo2-dev                # Cairo graphics library — canvas draws using this
      - libpango1.0-dev              # Pango text layout library — canvas uses this for fonts
      - libjpeg-dev                  # JPEG image support
      - libgif-dev                   # GIF image support
      - librsvg2-dev                 # SVG support (also needed by canvas)
